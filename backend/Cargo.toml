[package]
name = "dear-my-diary"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Dear My Diary - local-first diary backend"

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

# Vercel Function adapter. Only used by the `handler` binary, which serves the
# same router through Vercel instead of a TCP listener.
vercel_runtime = { version = "2", features = ["axum"] }

# Vercel looks for function binaries in api/, so this one is declared by hand.
[[bin]]
name = "handler"
path = "api/handler.rs"

# Tests are grouped by feature, mirroring the module layout.
[[test]]
name = "shared_rules"
path = "tests/common/shared_rules.rs"

[[test]]
name = "credentials"
path = "tests/auth/credentials.rs"

[[test]]
name = "entry_rules"
path = "tests/entries/entry_rules.rs"

[[test]]
name = "archive_parser"
path = "tests/imports/archive_parser.rs"

[[test]]
name = "portable_format"
path = "tests/exports/portable_format.rs"
